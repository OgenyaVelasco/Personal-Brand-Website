<script>
function waveTransition(event) {event.preventDefault();let link = event.currentTarget.href;setTimeout(() => {document.querySelector(".ring1").classList.add("expand"); }, 0);setTimeout(() => {document.querySelector(".ring2").classList.add("expand");}, 120);setTimeout(() => {document.querySelector(".ring3").classList.add("expand");}, 240);setTimeout(() => {document.querySelector(".ring4") .classList.add("expand");}, 360);setTimeout(() => { window.location.href = link; }, 1400);return false;}
</script>
